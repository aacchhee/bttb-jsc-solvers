[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bttb-jsc-solvers"
version = "1.0.0"
description = "Exact banded and half-strip two-level Toeplitz solvers accompanying the JSC paper"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{name = "Andrey Chesnokov"}]
dependencies = ["python-flint==0.9.0"]

[tool.setuptools.packages.find]
include = ["bttb_solvers*"]
